# Gjysma PUBLIKE e cift-celesave VAPID. Rri ketu me qellim, per tri arsye:
#
#   1. Eshte publike per nga natyra — shfletuesi i cdo vullnetari e merr ate
#      gjithsesi. Vetem `VAPID_PRIVATE_KEY` eshte sekret.
#   2. Nje `Variable` e thjeshte e vendosur te paneli i Cloudflare-it FSHIHET ne
#      publikimin e radhes: me nje bllok `[vars]` prezent, wrangler-i i heq te
#      gjitha variablat perpara se te vendose ato te konfigurimit. (Sekretet nuk
#      preken kurre.) Pra paneli eshte vendi i gabuar per te.
#   3. Ketu e lexojne te dyja anet — `src/worker.ts` ia kalon shfletuesit si
#      `<meta>`, dhe `functions/api/send-push.js` nenshkruan me te — ndaj nuk kane
#      si te dalin me celesa te ndryshem.
#
# MOS e shtoni gjithashtu si Secret te paneli: dy burime per te njejtin emer.
# Po e nderruat cift-celesave, nderroni edhe kete rresht.
VAPID_PUBLIC_KEY = "BDHpvuL0OqgIP2--2vCt2BRlKnVxck19TlzOvwEF3L5ztqieJxYXvEZqU1-_Ywoew9ppwzJA7QSOqUhfYr-huC0"

