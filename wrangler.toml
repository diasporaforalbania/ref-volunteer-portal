name = "portalreferendum21"
main = "src/worker.ts"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]

# SHENIM: `pages_build_output_dir` u hoq me qellim. Ky projekt publikohet si
# Worker (Workers Builds -> `portalreferendum21`), jo si Pages; me ate fushe
# prezente wrangler-i lokal kalonte ne modalitetin Pages dhe refuzonte
# binding-un `ASSETS`, ndaj `wrangler dev` nuk sillej si prodhimi.

# Cloudflare Workers static assets directory with native SPA fallback
[assets]
directory = "./dist"
# Pa `binding` Worker-i nuk e ka `env.ASSETS`, dhe `env.ASSETS.fetch()` te
# `src/worker.ts` hidhet me perjashtim -> cdo rruge qe nuk perputhet me nje
# skedar statik kthen "error code: 1101" ne vend te faqes SPA.
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
# Cdo kerkese kalon e para nga `src/worker.ts`.
#
# Dy arsye, te dyja te verifikuara:
#   1. Pa kete, `/` perputhet me `dist/index.html` dhe sherbehet drejt nga
#      shtresa e assets-eve — Worker-i nuk thirret fare, ndaj `withRuntimeConfig()`
#      nuk e fut dot `<meta name="vapid-public-key">` dhe njoftimet mbeten
#      "te padisponueshme" per te gjithe.
#   2. MOS e ktheni ne liste rrugesh (`["/", "/index.html"]`). Ne ate forme cdo
#      rruge e papermendur trajtohet TERESISHT nga assets-et, dhe me
#      `not_found_handling = "single-page-application"` kjo do te thote qe
#      `/api/count` e `/api/points` marrin index.html ne vend te JSON-it.
#
# Kostoja: edhe asset-et statike numerohen si thirrje Worker-i. Ne kete perdorim
# eshte e papercaktueshme; po u be shqetesim per kuoten, alternativa eshte
# `["/", "/index.html", "/api/*"]` — por atehere cdo endpoint i ri duhet shtuar
# ketu DHE te `src/worker.ts`.
run_worker_first = true

