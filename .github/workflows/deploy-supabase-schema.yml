name: Deploy Supabase schema

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-schema
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply schema.sql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Apply schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGOPTIONS: "-c lock_timeout=15000"
        # Një gabim nuk duhet ta lërë prodhimin me vetëm gjysmën e skemës së re.
        run: psql "$SUPABASE_DB_URL" --no-password --set=ON_ERROR_STOP=1 --single-transaction --file=schema.sql
